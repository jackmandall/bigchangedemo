<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>BigChange</title>
<style>
  :root{ --energy:#0072CE; --navy:#0A2240; --ink:#282922; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:Arial,Helvetica,sans-serif; color:var(--navy);
        background:linear-gradient(160deg,#f4f8fc 0%,#e9f1fb 100%);
        min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ text-align:center; max-width:540px; background:#fff; border-radius:18px;
         padding:54px 40px; box-shadow:0 18px 50px rgba(10,34,64,.10); }
  .mark{ display:inline-block; font-weight:800; font-size:13px; letter-spacing:.14em;
         text-transform:uppercase; color:var(--energy); margin-bottom:20px; }
  h1{ font-size:28px; line-height:1.25; margin-bottom:14px; }
  p{ font-size:16px; line-height:1.6; color:#46566b; }
  .bar{ width:54px; height:4px; border-radius:3px; background:var(--energy); margin:24px auto 0; }
  a{ color:var(--energy); font-weight:700; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <span class="mark">BigChange</span>
    <h1>Make every business unstoppable</h1>
    <p>This is a private space for prepared customer demonstrations. If you are expecting a page, please use the direct link shared with you by your BigChange contact.</p>
    <p style="margin-top:18px;">Find out more at <a href="https://www.bigchange.com" target="_blank" rel="noopener">bigchange.com</a></p>
    <div class="bar"></div>
  </div>
</body>
</html>
