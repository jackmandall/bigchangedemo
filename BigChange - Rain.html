  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en-GB\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>BigChange RAIN \u2014 Rolling out July\u2013October 2026<\u002Ftitle>\n<style>\u002F* ===========================================================\n   BigChange RAIN \u2014 release document styles\n   Built on the BigChange Lightning design system tokens\n   =========================================================== *\u002F\n\n@font-face { font-family:'Montserrat'; font-weight:400; font-style:normal; font-display:swap; src:url(\"86d00c5f-f902-4258-ad27-2d6a12f12789\") format('truetype'); }\n@font-face { font-family:'Montserrat'; font-weight:500; font-style:normal; font-display:swap; src:url(\"e9a3ae19-62aa-4994-8aed-64b7b673e9d6\") format('truetype'); }\n@font-face { font-family:'Montserrat'; font-weight:600; font-style:normal; font-display:swap; src:url(\"907db3cc-b68b-4577-9daf-bba132691d5b\") format('truetype'); }\n@font-face { font-family:'Montserrat'; font-weight:700; font-style:normal; font-display:swap; src:url(\"7677c005-7f9d-4dc0-831f-c4c67a5b37d8\") format('truetype'); }\n@font-face { font-family:'Montserrat'; font-weight:800; font-style:normal; font-display:swap; src:url(\"22d7e7ca-48f3-42e5-bc68-3237632b211a\") format('truetype'); }\n@font-face { font-family:'Montserrat'; font-weight:900; font-style:normal; font-display:swap; src:url(\"bce3d681-e2de-414f-9734-70e8d13931c4\") format('truetype'); }\n\n:root{\n  --bc-energy-blue:#0E72D6; --bc-energy-blue-600:#0B5FB3; --bc-energy-blue-300:#5FA6E8; --bc-energy-blue-100:#DEEBF8;\n  --bc-navy:#0E2A4B; --bc-navy-700:#0A1F38; --bc-navy-900:#050E1C;\n  --lt-marine-deep:#050E1C; --lt-marine:#0E2A4B; --lt-marine-mid:#0F4A86; --lt-marine-bright:#1E80D8; --lt-teal-glow:#1AC7C7;\n  --lt-volt-orange:#F58020; --lt-volt-amber:#F9A21B; --lt-volt-yellow:#FFC629; --lt-volt-bright:#FFD84A;\n  --lt-gradient-volt:linear-gradient(180deg,var(--lt-volt-orange) 0%,var(--lt-volt-amber) 45%,var(--lt-volt-yellow) 100%);\n  --lt-gradient-platform:linear-gradient(90deg,var(--lt-volt-orange) 0%,var(--lt-volt-amber) 18%,var(--lt-volt-yellow) 32%,#FFE070 45%,var(--lt-teal-glow) 65%,var(--lt-marine-bright) 85%,var(--lt-marine) 100%);\n  --lt-gradient-bg:radial-gradient(ellipse 120% 70% at 50% 28%,var(--lt-marine-bright) 0%,var(--lt-marine) 46%,var(--lt-marine-deep) 100%);\n\n  --neutral-0:#FFFFFF; --neutral-50:#F7F9FC; --neutral-100:#EEF2F7; --neutral-200:#DDE4EE; --neutral-300:#C2CCDA;\n  --neutral-400:#95A2B4; --neutral-500:#6B7A8F; --neutral-600:#4B5A70; --neutral-700:#2F3E55; --neutral-800:#1A2740; --neutral-900:#0E1A2E;\n\n  --fg-1:var(--neutral-900); --fg-2:var(--neutral-700); --fg-3:var(--neutral-500);\n  --fg-on-dark:#F4F8FE; --fg-on-dark-2:rgba(244,248,254,.74); --fg-on-dark-3:rgba(244,248,254,.52);\n  --border-1:var(--neutral-200); --border-2:var(--neutral-300); --border-on-dark:rgba(255,255,255,.12);\n\n  --font-sans:\"Montserrat\",\"Helvetica Neue\",Arial,sans-serif;\n  --r-md:10px; --r-lg:14px; --r-xl:20px; --r-2xl:28px; --r-pill:999px;\n  --ease-standard:cubic-bezier(.2,.6,.2,1);\n  --shadow-2:0 4px 12px rgba(14,42,75,.08),0 1px 2px rgba(14,42,75,.05);\n  --shadow-3:0 12px 32px rgba(14,42,75,.12),0 2px 6px rgba(14,42,75,.06);\n  --shadow-glow-volt:0 0 0 1px rgba(255,198,41,.4),0 8px 32px rgba(255,162,27,.45);\n\n  --maxw:1180px;\n  --gutter:clamp(22px,5vw,64px);\n}\n\n*{box-sizing:border-box;}\nhtml{scroll-behavior:smooth;}\nbody{\n  margin:0; font-family:var(--font-sans); color:var(--fg-1); background:var(--lt-marine-deep);\n  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;\n  overflow-x:hidden;\n}\nimg{display:block; max-width:100%;}\n.wrap{max-width:var(--maxw); margin:0 auto; padding:0 var(--gutter);}\n\n\u002F* ---------- shared type helpers ---------- *\u002F\n.eyebrow{\n  font-weight:700; font-size:12px; letter-spacing:.2em; text-transform:uppercase;\n  color:var(--bc-energy-blue); margin:0;\n}\n.eyebrow.on-dark{ color:var(--lt-volt-yellow); }\n.volt-text{\n  background:linear-gradient(96deg,var(--lt-volt-orange),var(--lt-volt-amber) 45%,var(--lt-volt-yellow));\n  -webkit-background-clip:text; background-clip:text; color:transparent;\n}\n.rain-text{\n  background:linear-gradient(180deg,#FFFFFF 0%,#9FD2F4 70%,var(--lt-teal-glow) 130%);\n  -webkit-background-clip:text; background-clip:text; color:transparent;\n}\n\n\u002F* =========================================================\n   RAIN STREAKS (decorative)\n   ========================================================= *\u002F\n.rain-layer{\n  position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:1;\n  -webkit-mask-image:linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent);\n          mask-image:linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent);\n}\n.rain-layer i{\n  position:absolute; top:-30%; width:1px; height:38%;\n  background:linear-gradient(180deg,transparent,rgba(159,210,244,.55),transparent);\n  transform:rotate(8deg); opacity:.5;\n  animation:rainfall linear infinite;\n}\n@keyframes rainfall{\n  0%{ transform:translateY(-40%) rotate(8deg); }\n  100%{ transform:translateY(360%) rotate(8deg); }\n}\n@media (prefers-reduced-motion: reduce){\n  .rain-layer i{ animation:none; }\n}\n\n\u002F* =========================================================\n   HERO\n   ========================================================= *\u002F\n.hero{\n  position:relative; overflow:hidden;\n  background:var(--lt-gradient-bg);\n  color:var(--fg-on-dark);\n  padding:38px 0 120px;\n}\n.hero::after{ \u002F* warm glow rising from the horizon *\u002F\n  content:\"\"; position:absolute; left:-10%; right:-10%; top:42%; height:60%;\n  background:radial-gradient(ellipse at 50% 0%,rgba(255,196,80,.22),transparent 60%);\n  filter:blur(30px); pointer-events:none; z-index:1;\n}\n.hero-topbar{\n  position:relative; z-index:5; display:flex; align-items:center; justify-content:space-between;\n}\n.hero-topbar img.logo{ height:26px; }\n.hero-topbar .doc-tag{\n  font-weight:600; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--fg-on-dark-2);\n}\n.hero-grid{\n  position:relative; z-index:4;\n  margin-top:clamp(48px,8vw,104px);\n  display:grid; grid-template-columns:minmax(0,1fr) clamp(220px,30%,360px); gap:48px; align-items:center;\n}\n.kicker{\n  display:inline-flex; align-items:center; gap:10px;\n  font-weight:700; font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--lt-volt-yellow);\n  padding:7px 15px; border-radius:var(--r-pill);\n  background:rgba(255,200,80,.10); border:1px solid rgba(255,200,80,.28);\n}\n.kicker svg{ flex:none; }\n.hero h1{\n  margin:26px 0 0; color:#fff; font-weight:900;\n  font-size:clamp(46px,8.4vw,108px); line-height:.97; letter-spacing:-.02em; text-wrap:balance;\n}\n.hero h1 .line{ display:block; }\n.hero .subhead{\n  margin:30px 0 0; max-width:660px; font-weight:500;\n  font-size:clamp(18px,2.1vw,24px); line-height:1.45; color:var(--fg-on-dark);\n}\n.hero .subhead b{ color:#fff; font-weight:700; }\n.hero .intro{\n  margin:26px 0 0; max-width:600px; font-weight:400; font-size:17px; line-height:1.62; color:var(--fg-on-dark-2);\n}\n.hero .intro b{ color:#fff; font-weight:600; }\n\n.hero-bolt{ position:relative; display:flex; align-items:center; justify-content:center; }\n.hero-bolt .glow{\n  position:absolute; inset:-8% -10%; border-radius:50%;\n  background:radial-gradient(circle,rgba(255,200,80,.45),transparent 62%); filter:blur(46px);\n}\n.hero-bolt img{\n  position:relative; z-index:2; height:clamp(220px,34vw,420px);\n  filter:drop-shadow(0 22px 60px rgba(255,162,27,.45)) drop-shadow(0 0 40px rgba(255,198,41,.3));\n}\n\n.hero-metrics{\n  position:relative; z-index:4; margin-top:64px; padding-top:30px;\n  border-top:1px solid var(--border-on-dark);\n  display:grid; grid-template-columns:repeat(3,auto) 1fr; gap:clamp(28px,5vw,64px); align-items:end;\n}\n. ;\n  background:var(--neutral-50); cursor:pointer; list-style:none; user-select:none;\n  transition:background .18s;\n}\n.idx-group-head::-webkit-details-marker{ display:none; }\n.idx-group-head:hover{ background:var(--neutral-100); }\n.idx-group[open] .idx-group-head{ border-bottom:1px solid var(--border-1); }\n.idx-group-head .name{ font-weight:800; font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--bc-navy); }\n.idx-group-head .count{\n  font-weight:700; font-size:12px; color:#fff; background:var(--bc-energy-blue);\n  padding:3px 11px; border-radius:var(--r-pill); letter-spacing:.04em;\n}\n.idx-group-head .bar{ flex:1; height:1px; background:var(--border-1); }\n.idx-chevron{\n  flex:none; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;\n  background:var(--neutral-100); color:var(--bc-navy); transition:transform .25s var(--ease-standard),background .2s;\n}\n.idx-chevron svg{ width:14px; height:14px; }\n.idx-group[open] .idx-chevron{ transform:rotate(180deg); background:var(--bc-energy-blue-100); color:var(--bc-energy-blue); }\n.idx-list{\n  margin:0; padding:14px 22px 20px; list-style:none;\n  columns:3; column-gap:36px;\n}\n.idx-list li{\n  break-inside:avoid; padding:7px 0 7px 18px; position:relative;\n  font-weight:400; font-size:12.5px; line-height:1.42; color:var(--fg-2);\n  border-bottom:1px solid var(--neutral-100);\n}\n.idx-list li::before{\n  content:\"\"; position:absolute; left:0; top:13px; width:7px; height:7px; border-radius:50%;\n  background:var(--bc-energy-blue-300);\n}\n.idx-list li b{ font-weight:600; color:var(--fg-1); }\n\n\u002F* =========================================================\n   FOOTER \u002F CTA\n   ========================================================= *\u002F\n.s-footer{\n  position:relative; overflow:hidden; background:var(--lt-gradient-bg); color:var(--fg-on-dark);\n  padding:clamp(80px,10vw,140px) 0 64px; text-align:center;\n}\n.s-footer .platform{ position:absolute; left:0; right:0; top:0; height:3px; background:var(--lt-gradient-platform); box-shadow:0 0 40px rgba(255,200,80,.4); }\n.s-footer::after{\n  content:\"\"; position:absolute; left:-10%; right:-10%; top:-20%; height:60%;\n  background:radial-gradient(ellipse at 50% 0%,rgba(30,128,216,.4),transparent 60%); filter:blur(40px); pointer-events:none;\n}\n.s-footer .inner{ position:relative; z-index:2; max-width:860px; margin:0 auto; }\n.s-footer .thunder{\n  font-weight:700; font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--lt-volt-yellow); margin:0 0 26px;\n}\n.s-footer h2{\n  margin:0; font-weight:800; font-size:clamp(32px,4.6vw,58px); line-height:1.08; letter-spacing:-.02em; color:#fff; text-wrap:balance;\n}\n.s-footer h2 .rain-text{ font-weight:900; }\n.s-footer p.cta-copy{ margin:26px auto 0; max-width:620px; font-weight:400; font-size:clamp(16px,1.8vw,19px); line-height:1.6; color:var(--fg-on-dark-2); }\n.s-footer .cta-row{ margin-top:38px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }\n.btn-volt{\n  display:inline-flex; align-items:center; gap:10px;\n  background:linear-gradient(180deg,var(--lt-volt-orange),var(--lt-volt-yellow)); color:var(--bc-navy);\n  font-weight:700; font-size:15px; padding:14px 26px; border-radius:var(--r-md); border:none; cursor:pointer;\n  box-shadow:var(--shadow-glow-volt); text-decoration:none; transition:filter .2s;\n}\n.btn-volt:hover{ filter:brightness(1.06); }\n.btn-volt svg{ width:15px; height:18px; }\n.fine-print{ margin:46px 0 0; font-weight:400; font-size:12.5px; color:var(--fg-on-dark-3); letter-spacing:.02em; }\n.footer-logo{ margin-top:54px; display:flex; align-items:center; justify-content:center; gap:16px; }\n.footer-logo img{ height:24px; opacity:.92; }\n.footer-logo .sep{ width:1px; height:20px; background:var(--border-on-dark); }\n.footer-logo .rain-word{ font-weight:800; font-size:14px; letter-spacing:.26em; color:var(--fg-on-dark-2); }\n\n\u002F* =========================================================\n   RESPONSIVE\n   ========================================================= *\u002F\n@media (max-width:900px){\n  .hero-grid{ grid-template-columns:1fr; }\n  .hero-bolt{ display:none; }\n  .hero-horizon{ top:64%; }\n  .hero-metrics{ grid-template-columns:repeat(3,1fr); gap:20px 16px; }\n  .headliners{ grid-template-columns:1fr; }\n  .feat-card.wide{ grid-column:auto; }\n  .more-grid{ grid-template-columns:1fr 1fr; }\n  .enh-cards{ grid-template-columns:1fr 1fr; }\n  .lastmile-list{ columns:1; }\n  .index-head{ grid-template-columns:1fr; }\n  .index-count{ text-align:left; }\n  .idx-list{ columns:2; }\n}\n@media (max-width:560px){\n  .more-grid{ grid-template-columns:1fr; }\n  .enh-cards{ grid-template-columns:1fr; }\n  .idx-list{ columns:1; }\n  .hero-metrics{ grid-template-columns:1fr 1fr; }\n}\n\n\u002F* =========================================================\n   PRINT\n   ========================================================= *\u002F\n@media print{\n  body{ background:#fff; }\n  .rain-layer{ display:none; }\n  .section, .hero, .bridge, .s-footer{ break-inside:avoid; }\n  .feat-card,.feat-mini,.enh-item,.idx-group{ break-inside:avoid; }\n  .hero,.s-features,.bridge,.s-footer{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }\n  \u002F* force every fix category open for print\u002FPDF *\u002F\n  .idx-group .idx-list{ display:block !important; }\n  .idx-chevron, .index-tools{ display:none !important; }\n}\n<\u002Fstyle>\n\n<\u002Fhead>\n<body>\n\n<!-- =================== HERO =================== -->\n<header class=\"hero\" data-screen-label=\"Hero\">\n  <div class=\"rain-layer\" id=\"rainLayer\"><\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"hero-topbar\">\n      <img class=\"logo\" src=\"c48e13f7-933c-4c86-94bc-ebd75089aae0\" alt=\"BigChange\">\n      <span class=\"doc-tag\">Product Release \u00b7 2026<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"hero-grid\">\n      <div class=\"hero-copy\">\n        <span class=\"kicker\">\n          <svg width=\"10\" height=\"14\" viewBox=\"0 0 10 14\" fill=\"none\"><path d=\"M5.5 0L0 8h3.5L3 14l6.5-9H6l1-5z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n          BigChange RAIN \u00b7 Rolling out July\u2013October 2026\n        <\u002Fspan>\n        <h1>\n          <span class=\"line\">After the <span class=\"volt-text\">LIGHTNING<\u002Fspan><\u002Fspan>\n          <span class=\"line\">comes the <span class=\"rain-text\">RAIN.<\u002Fspan><\u002Fspan>\n        <\u002Fh1>\n        <p class=\"subhead\"><b>7 killer new features. 28 AI-infused enhancements.<\u002Fb> All falling on the BigChange platform you already run your business on.<\u002Fp>\n        <p class=\"intro\">When we put an AI brain at the centre of your platform with <b>BigChange Lightning<\u002Fb>, we promised it would help us build faster \u2014 shipping what you actually ask for, sooner. RAIN is the proof. You asked. We built. Now it pours.<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"hero-bolt\" aria-hidden=\"true\">\n        <div class=\"glow\"><\u002Fdiv>\n        <img src=\"c1a13242-bf72-4b18-8f55-cb99db8502c3\" alt=\"\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"hero-metrics\">\n      <div class=\"metric\"><div class=\"n volt\">7<\u002Fdiv><div class=\"l\">Killer new features<\u002Fdiv><\u002Fdiv>\n      <div class=\"metric\"><div class=\"n\">28<\u002Fdiv><div class=\"l\">AI-infused enhancements<\u002Fdiv><\u002Fdiv>\n      \n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- =================== SECTION ONE \u2014 KILLER NEW FEATURES =================== -->\n<section class=\"section s-features\" data-screen-label=\"Killer New Features\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <div class=\"section-num\">Section One \u2014 Killer New Features<\u002Fdiv>\n      <h2 class=\"section-title\">Seven killer, net-new ways to win, run and get paid.<\u002Fh2>\n      <p class=\"section-lead\">Seven net-new capabilities for your BigChange platform \u2014 built faster thanks to the AI development engine behind <b>BigChange Lightning<\u002Fb>. New ways to win work, run jobs, and get paid.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"section-meta\">\n      <div class=\"lightning-note\">\n        <span class=\"ln-bolt\"><svg viewBox=\"0 0 10 14\" fill=\"none\"><path d=\"M5.5 0L0 8h3.5L3 14l6.5-9H6l1-5z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"ln-copy\">\n          <span class=\"ln-title\">Powered by BigChange Lightning<\u002Fspan>\n          <span class=\"ln-fine\">These features require the BigChange Lightning platform upgrade.<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"legend\">\n        <span class=\"legend-swatch\"><svg viewBox=\"0 0 10 14\" fill=\"none\"><path d=\"M5.5 0L0 8h3.5L3 14l6.5-9H6l1-5z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <span class=\"legend-text\"><b>Yellow outline<\u002Fb> = Highly Requested by customers like you.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"group-label\"><span class=\"dot\"><\u002Fspan> The Headliners<\u002Fdiv>\n\n    <div class=\"headliners\">\n      <article class=\"feat-card requested\">\n        <div class=\"feat-top\"><span class=\"feat-idx\">01<\u002Fspan><span class=\"feat-badges\"><span class=\"badge-requested\"><svg viewBox=\"0 0 10 14\" fill=\"none\"><path d=\"M5.5 0L0 8h3.5L3 14l6.5-9H6l1-5z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>Highly Requested<\u002Fspan><span class=\"badge-month\">Q4<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <h3>Full-Featured Sales CRM<\u002Fh3>\n        <p class=\"desc\">Stop losing deals because your sales and ops live in different systems. The expanded CRM turns BigChange into your full sales engine \u2014 manage leads, track every customer interaction, and run your entire pipeline right alongside live operations, so nothing falls through the cracks.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"feat-card requested\">\n        <div class=\"feat-top\"><span class=\"feat-idx\">02<\u002Fspan><span class=\"feat-badges\"><span class=\"badge-requested\"><svg viewBox=\"0 0 10 14\" fill=\"none\"><path d=\"M5.5 0L0 8h3.5L3 14l6.5-9H6l1-5z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>Highly Requested<\u002Fspan><span class=\"badge-month\">October<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <h3>AI-Powered Real-Time Schedule Optimisation<\u002Fh3>\n        <p class=\"desc\">React to change without missing a beat. When a job is cancelled or an urgent call comes in, BigChange instantly re-optimises your entire schedule \u2014 giving every technician the most efficient route and workload automatically, without a dispatcher touching the board.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"feat-card\">\n        <div class=\"feat-top\"><span class=\"feat-idx\">03<\u002Fspan><span class=\"badge-month\">September<\u002Fspan><\u002Fdiv>\n        <h3>Complex Multi-Day Job Management<\u002Fh3>\n        <p class=\"desc\">Bigger jobs, perfectly orchestrated. Plan and manage multi-day projects with the right people assigned end to end \u2014 resource continuity guaranteed, so larger installations and service engagements run smoothly without costly handoff gaps.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"feat-card\">\n        <div class=\"feat-top\"><span class=\"feat-idx\">04<\u002Fspan><span class=\"badge-month\">September<\u002Fspan><\u002Fdiv>\n        <h3>AI-Validated Photo Capture<\u002Fh3>\n        <p class=\"desc\">AI validation automatically reviews each photo to make sure engineers have captured the right thing, first time. No more follow-up visits, no more disputes \u2014 accurate job evidence, every time.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n\n    <div class=\"group-label\"><span class=\"dot\"><\u002Fspan> More Killer Features<\u002Fdiv>\n\n    <div class=\"more-grid\">\n      <article class=\"feat-mini requested\">\n        <div class=\"feat-top\"><span class=\"feat-idx\">05<\u002Fspan><span class=\"feat-badges\"><span class=\"badge-requested\"><svg viewBox=\"0 0 10 14\" fill=\"none\"><path d=\"M5.5 0L0 8h3.5L3 14l6.5-9H6l1-5z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>Highly Requested<\u002Fspan><span class=\"badge-month\">August<\u002Fspan><\u002Fspan><\u002Fdiv>\n        <h4>Fully Customisable Asset Records<\u002Fh4>\n        <p class=\"desc\">Assets as unique as the work you do on them. Add custom fields for any attribute your engineers or customers need \u2014 richer records that power smarter servicing, better compliance reporting, and more informed engineers on every visit.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"feat-mini\">\n        <div class=\"feat-top\"><span class=\"feat-idx\">06<\u002Fspan><span class=\"badge-month\">October<\u002Fspan><\u002Fdiv>\n        <h4>Asset-Linked Reactive Work Management<\u002Fh4>\n        <p class=\"desc\">Every fault logged, every fix recorded, every asset fully understood. Log and resolve issues against customer assets directly from the job \u2014 building a rich service history so your next visit starts with the complete picture, not a blank page.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"feat-mini\">\n        <div class=\"feat-top\"><span class=\"feat-idx\">07<\u002Fspan><span class=\"badge-month\">July<\u002Fspan><\u002Fdiv>\n        <h4>Easy Multi-Image Capture<\u002Fh4>\n        <p class=\"desc\">Capture every detail, protect every job. Easily collect multiple job photos and videos in one smooth flow from JobWatch \u2014 complete, timestamped proof of work, so you don't miss the smallest detail.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- =================== SECTION TWO \u2014 AI-INFUSED ENHANCEMENTS =================== -->\n<section class=\"section s-enhance\" data-screen-label=\"AI-Infused Enhancements\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <div class=\"section-num\">Section Two \u2014 AI-Infused Enhancements<\u002Fdiv>\n      <h2 class=\"section-title\">AI-Infused Enhancements: <span class=\"resp\">you asked. We built.<\u002Fspan><\u002Fh2>\n      <p class=\"section-lead\">Not everything in RAIN is brand new \u2014 some of it is something better. These enhancements come straight from your requests: taking the BigChange features you rely on every day and pushing them further. And every one is now wired into <b>Cooper AI<\u002Fb> \u2014 so it can learn from how you use them, optimise them over time, and surface sharper insight back to you. This is what it looks like when your platform listens.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"lightning-note on-light\">\n      <span class=\"ln-bolt\"><svg viewBox=\"0 0 10 14\" fill=\"none\"><path d=\"M5.5 0L0 8h3.5L3 14l6.5-9H6l1-5z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <span class=\"ln-copy\">\n        <span class=\"ln-title\">Powered by BigChange Lightning<\u002Fspan>\n        <span class=\"ln-fine\">Selected enhancements require the BigChange Lightning platform upgrade.<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"enh-cards\">\n      <article class=\"enh-card\">\n        <div class=\"cat\">Financial Management<\u002Fdiv>\n        <h4>Professional Structured Quoting<\u002Fh4>\n        <p class=\"desc\">Quotes that win on presentation as well as price. Build multi-option, sectioned quotes with protected margin data \u2014 giving customers a clear, professional experience and giving you a faster, more flexible path from quote to signed job.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"enh-card\">\n        <div class=\"cat\">Financial Management<\u002Fdiv>\n        <h4>Consolidated Multi-Site Invoicing<\u002Fh4>\n        <p class=\"desc\">One invoice run to cover all sites. Group &amp; Bulk Financials lets you invoice multiple locations or subsidiaries in a single consolidated process \u2014 cutting the back-and-forth with accounts teams and slashing the time your finance team spends on AR.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"enh-card\">\n        <div class=\"cat\">Scheduling<\u002Fdiv>\n        <h4>Priority Job Scheduling Lock<\u002Fh4>\n        <p class=\"desc\">Your most critical jobs stay exactly where you put them. Lock high-priority jobs against accidental rescheduling \u2014 so when the board gets busy, what matters most never gets bumped.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"enh-card\">\n        <div class=\"cat\">Data &amp; Insights<\u002Fdiv>\n        <h4>Role-Based JustAsk Access Control<\u002Fh4>\n        <p class=\"desc\">The right insights for the right people. Role-based permissions keep JustAsk answers scoped precisely to what each user is authorised to see \u2014 data governance built into every query, without slowing anyone down.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"enh-card\">\n        <div class=\"cat\">Inventory &amp; Compliance<\u002Fdiv>\n        <h4>Real-Time Inventory &amp; F-Gas Compliance Hub<\u002Fh4>\n        <p class=\"desc\">Inventory control and regulatory compliance, finally unified. Track real-time stock levels and every refrigerant gas movement for F-Gas compliance \u2014 all in one system, eliminating the parallel spreadsheets and the audit risk that comes with them.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"enh-card\">\n        <div class=\"cat\">Compliance<\u002Fdiv>\n        <h4>F-Gas Compliance Forms<\u002Fh4>\n        <p class=\"desc\">The certificates and records F-Gas demands, built into the job. Capture compliant F-Gas forms directly in BigChange \u2014 every refrigerant handling documented and audit-ready, with no parallel paperwork.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"enh-card\">\n        <div class=\"cat\">Data &amp; Insights<\u002Fdiv>\n        <h4>Configurable JustAsk Data Freshness<\u002Fh4>\n        <p class=\"desc\">Fresh answers when your team needs them most. Choose your JustAsk data refresh frequency \u2014 faster tiers for the teams making real-time decisions, standard intervals for everyone else. Fresher data, smarter queries.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"enh-card\">\n        <div class=\"cat\">APIs<\u002Fdiv>\n        <h4>Broader Integration APIs<\u002Fh4>\n        <p class=\"desc\">Connect BigChange to everything your business runs on. Broader, more complete APIs, with webhooks, mean deeper, real-time integrations with your ERP, accounting platform, or custom workflows \u2014 less double-keying, more up-to-date, accurate information at your fingertips.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"enh-card\">\n        <div class=\"cat\">Compliance<\u002Fdiv>\n        <h4>France E-Invoicing Compliance Automation<\u002Fh4>\n        <p class=\"desc\">Stay compliant with France's e-invoicing mandate without lifting a finger. BigChange automatically generates and exchanges legally compliant electronic invoices for your French operations \u2014 zero manual workarounds, zero compliance risk.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"enh-card\">\n        <div class=\"cat\">Data &amp; Insights<\u002Fdiv>\n        <h4>Deeper JustAsk Business Intelligence<\u002Fh4>\n        <p class=\"desc\">Ask bigger questions, get more complete answers. JustAsk now reaches across a wider breadth of your BigChange data \u2014 so every query is grounded in more of your operation and the insights you get are genuinely business-wide.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"enh-card\">\n        <div class=\"cat\">Compliance<\u002Fdiv>\n        <h4>Built-In Waste Duty-of-Care Records<\u002Fh4>\n        <p class=\"desc\">Compliance paperwork that completes itself. Capture waste receiver data directly from the job in BigChange \u2014 the duty-of-care records you need are created automatically, auditable instantly, and never left to chance.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"enh-card\">\n        <div class=\"cat\">Hire<\u002Fdiv>\n        <h4>Hire Industry Integrations &amp; Damage Detection<\u002Fh4>\n        <p class=\"desc\">High-value information sync with TACHO, HGV, and ERP systems used in the hire industry, plus the ability to auto-detect damage on hired-out assets \u2014 protect your equipment and your margins.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n\n    <div class=\"lastmile\">\n      <div class=\"lastmile-head\">\n        <span class=\"lm-title\">The last mile<\u002Fspan>\n        <span class=\"lm-sub\">16 finishing touches \u2014 the smaller refinements you asked for<\u002Fspan>\n      <\u002Fdiv>\n      <ul class=\"lastmile-list\">\n        <li><span class=\"lm-tag\">Attachments<\u002Fspan>Smarter Document Attachments<\u002Fli>\n        <li><span class=\"lm-tag\">JobBrief<\u002Fspan>Richer Pre-Job Briefings<\u002Fli>\n        <li><span class=\"lm-tag\">JobScribe<\u002Fspan>Sharper AI Job Note Capture<\u002Fli>\n        <li><span class=\"lm-tag\">GPS<\u002Fspan>More Precise GPS Tracking<\u002Fli>\n        <li><span class=\"lm-tag\">Finance<\u002Fspan>Faster, More Accurate Invoicing<\u002Fli>\n        <li><span class=\"lm-tag\">Resource Mgmt<\u002Fspan>Smarter Resource Allocation<\u002Fli>\n        <li><span class=\"lm-tag\">Two-Way<\u002Fspan>Reliable Office-to-Field Messaging<\u002Fli>\n        <li><span class=\"lm-tag\">Finance<\u002Fspan>Streamlined Payment Reconciliation<\u002Fli>\n        <li><span class=\"lm-tag\">Job Mgmt<\u002Fspan>Refined Job Lifecycle Management<\u002Fli>\n        <li><span class=\"lm-tag\">Mobile<\u002Fspan>Polished Mobile Field Experience<\u002Fli>\n        <li><span class=\"lm-tag\">Fleet Mgmt<\u002Fspan>Enhanced Fleet Visibility &amp; Reporting<\u002Fli>\n        <li><span class=\"lm-tag\">Job Evidencing<\u002Fspan>Stronger Job Proof &amp; Evidence Capture<\u002Fli>\n        <li><span class=\"lm-tag\">Job Mgmt<\u002Fspan>Tighter Job Scheduling Workflow<\u002Fli>\n        <li><span class=\"lm-tag\">Scheduling<\u002Fspan>Sharper Schedule Optimisation<\u002Fli>\n        <li><span class=\"lm-tag\">Scheduling<\u002Fspan>Better Scheduling Constraint Management<\u002Fli>\n        <li><span class=\"lm-tag\">Scheduling<\u002Fspan>Clearer Scheduling Views<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- =================== BRIDGE BAND =================== -->\n<section class=\"bridge\" data-screen-label=\"Bridge\">\n  <div class=\"platform\"><\u002Fdiv>\n  <div class=\"wrap\">\n    <p><span class=\"muted\">\u2026and those are just the biggest RAIN-Drops.<\u002Fspan> The full index of this storm follows \u2014 every one a direct response to a customer request. Because the best AI doesn't replace the tools you love. It makes them <span class=\"volt-text\">better, faster.<\u002Fspan><\u002Fp>\n  <\u002Fdiv>\n  <div class=\"platform bottom\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- =================== FOOTER \u002F CTA =================== -->\n<footer class=\"s-footer\" data-screen-label=\"Close\">\n  <div class=\"platform\"><\u002Fdiv>\n  <div class=\"rain-layer\" id=\"rainLayerFoot\"><\u002Fdiv>\n  <div class=\"wrap\">\n    <div class=\"inner\">\n      <p class=\"thunder\">A season of RAIN<\u002Fp>\n      <h2>This is a season of <span class=\"rain-text\">RAIN<\u002Fspan> \u2014 and it's only the beginning.<\u002Fh2>\n      <p class=\"cta-copy\">If the improvement you want most isn't here, it may just be in the next storm. Talk to your Account Manager to see what RAIN means for your business.<\u002Fp>\n      <div class=\"cta-row\">\n        <a class=\"btn-volt\" href=\"#\">\n          <svg viewBox=\"0 0 10 14\" fill=\"none\"><path d=\"M5.5 0L0 8h3.5L3 14l6.5-9H6l1-5z\" fill=\"currentColor\"><\u002Fpath><\u002Fsvg>\n          Talk to your Account Manager\n        <\u002Fa>\n      <\u002Fdiv>\n      <p class=\"fine-print\">Feature timing reflects current targets and may shift.<\u002Fp>\n      <div class=\"footer-logo\">\n        <img src=\"c48e13f7-933c-4c86-94bc-ebd75089aae0\" alt=\"BigChange\">\n        <span class=\"sep\"><\u002Fspan>\n        <span class=\"rain-word\">RAIN<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  \u002F\u002F Fix-index accordion: expand\u002Fcollapse all\n  (function(){\n    var btn = document.getElementById('expandAll');\n    if(!btn) return;\n    var groups = [].slice.call(document.querySelectorAll('.idx-group'));\n    var label = btn.querySelector('.ea-label');\n    function sync(){\n      var allOpen = groups.length && groups.every(function(d){ return d.open; });\n      btn.setAttribute('data-all-open', allOpen ? 'true' : 'false');\n      label.textContent = allOpen ? 'Collapse all' : 'Expand all';\n    }\n    btn.addEventListener('click', function(){\n      var allOpen = groups.every(function(d){ return d.open; });\n      groups.forEach(function(d){ d.open = !allOpen; });\n      sync();\n    });\n    groups.forEach(function(d){ d.addEventListener('toggle', sync); });\n    sync();\n  })();\n\n  (function(){\n    function fill(id, count){\n      var el = document.getElementById(id);\n      if(!el) return;\n      var html = '';\n      for(var i=0;i<count;i++){\n        var left = Math.random()*100;\n        var dur = 1.6 + Math.random()*2.4;\n        var delay = -Math.random()*dur;\n        var h = 22 + Math.random()*30;\n        var op = 0.25 + Math.random()*0.4;\n        html += '<i style=\"left:'+left.toFixed(2)+'%;height:'+h.toFixed(0)+'%;'+\n                'animation-duration:'+dur.toFixed(2)+'s;animation-delay:'+delay.toFixed(2)+'s;'+\n                'opacity:'+op.toFixed(2)+'\"><\u002Fi>';\n      }\n      el.innerHTML = html;\n    }\n    fill('rainLayer', 26);\n    fill('rainLayerFoot', 16);\n  })();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
